services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d test']
      interval: 5s
      timeout: 3s
      retries: 10
  mail:
    image: node:20-alpine
    working_dir: /codeforge
    volumes:
      - .:/codeforge:ro
    command: ['node', 'tests/e2e/mail-sink.mjs']
    environment:
      MAIL_SANDBOX_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:8025:8025'
