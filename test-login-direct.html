<!DOCTYPE html>
<html>
<head>
    <title>Test Login Direct</title>
</head>
<body>
    <h1>Direct Login Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>
    
    <script>
        async function testLogin() {
            try {
                console.log('Testing login...')
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@gfgmitadt.in',
                        password: 'admin123'
                    })
                })
                
                const data = await response.json()
                console.log('Response:', response.status, data)
                
                document.getElementById('result').innerHTML = `
                    <h3>Status: ${response.status}</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `
                
                if (response.ok) {
                    document.getElementById('result').innerHTML += '<p style="color: green">✅ Login successful!</p>'
                } else {
                    document.getElementById('result').innerHTML += '<p style="color: red">❌ Login failed!</p>'
                }
            } catch (error) {
                console.error('Error:', error)
                document.getElementById('result').innerHTML = `
                    <h3 style="color: red">Network Error:</h3>
                    <pre>${error.message}</pre>
                `
            }
        }
    </script>
</body>
</html>
